<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RStudio Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <span id="brand">RStudio Chat</span>
    <span id="model-badge"></span>
  </header>
  <main id="messages"></main>
  <footer id="composer">
    <textarea id="input" rows="3" placeholder="Ask to analyze data, write R code, run it..."></textarea>
    <button id="send">Send</button>
  </footer>
  <script src="app.js"></script>
</body>
</html>
